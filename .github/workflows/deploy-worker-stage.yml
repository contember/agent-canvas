name: Deploy worker to stage

on:
  push:
    branches: [main]
    paths:
      - "workers/canvas-share/**"
      - "daemon/client/**"
      - "daemon/build.ts"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/deploy-worker-stage.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      env: stage
    # inherit so the reusable workflow can resolve secrets; the env-scoped
    # values (set on the `stage` environment) win over repo-level ones.
    secrets: inherit
