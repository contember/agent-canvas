name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Pinned rather than
      # inherited from the Node image so a runner image bump cannot silently
      # move us off a version that supports it.
      - name: Pin trusted-publishing npm CLI
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release versions
        run: bun run check:versions

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Dependencies must exist on npm before their consumers are published.
      - name: Publish shared packages
        run: |
          for package in daemon-kit annotations canvas-kernel; do
            (
              cd "packages/$package"
              version=$(node -p "require('./package.json').version")
              if npm view "@fabrika/$package@$version" version >/dev/null 2>&1; then
                echo "@fabrika/$package@$version already published — skipping"
                exit 0
              fi
              npm publish --provenance --access public
            )
          done

      - name: Publish agent-canvas
        run: npm publish --provenance --access public
